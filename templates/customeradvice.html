<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Customer Advice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; max-width: 900px; }
    .back {
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:6px; border:1px solid #e6e6e6;
      background:#fff; color:#1a73e8; text-decoration:none; cursor:pointer; font-weight:600;
    }
    .card { border:1px solid #e6e6e6; padding:16px; border-radius:8px; background:#fff; margin-top:12px; }
    table { border-collapse: collapse; width: 100%; margin-top:12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
    <h1>Top 5 Advice for Customer {{ klantcode }}</h1>

    {% if results %}
        <ul>
        {% for r in results %}
            <li>
                <strong>{{ r.item_name }}</strong><br>
                Code: {{ r.item_code }}<br>
                Description: {{ r.item_description }}<br>
                Score: {{ "%.4f"|format(r.score) }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No recommendations found.</p>
    {% endif %}
</body>
</html>
